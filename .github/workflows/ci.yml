name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libfuse3-dev \
            fuse3 \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            python3-nautilus \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ncrs-gui/pnpm-lock.yaml

      - name: Run tests
        run: cargo test -p ncrs_core

  e2e:
    name: e2e (data-loss)
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs the ncrs CLI daemon against a real (non-Nextcloud) WebDAV server
      # over FUSE and asserts no data loss across CRUD / move / delete.
      # ubuntu-latest ships docker + compose and exposes /dev/fuse.
      - name: Run e2e suite
        run: scripts/e2e.sh
