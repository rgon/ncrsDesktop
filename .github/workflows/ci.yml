name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

# Cancel the in-progress run when a new commit arrives on the same PR.
# This is critical for release-please PRs: when update-lockfile pushes the
# corrected Cargo.lock, the current run (which hasn't started building yet)
# is cancelled and a fresh run starts with the correct lockfile already in place.
# Master pushes are never cancelled — they always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Lockfile hygiene ─────────────────────────────────────────────────────────
  # release-please bumps versions in Cargo.toml but never runs cargo, so
  # Cargo.lock is stale on PR open. This job refreshes it (workspace entries
  # only — external pins are untouched) and commits it back to the PR branch
  # before any build job starts. The push triggers a fresh CI run; the
  # concurrency group above cancels this run before build ever starts, so
  # the build always sees a coherent Cargo.toml + Cargo.lock pair.
  #
  # NO job-level `if` here — the job must always succeed (instantly, as a
  # no-op) on non-release-please runs. A skipped job propagates through the
  # entire needs chain and silently skips e2e and release-please too.
  update-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Set only when a commit was pushed; used by build to check out the
      # updated tree so hashFiles() in the cache key reflects the new lockfile.
      head-sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')

      - name: Refresh Cargo.lock for bumped workspace versions
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: cargo update --workspace

      - name: Commit and push if lockfile changed
        id: push
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: |
          git diff --quiet Cargo.lock && exit 0
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: update Cargo.lock for release'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    needs: [update-lockfile]
    runs-on: ubuntu-22.04
    env:
      # Must be job-level so the sccache daemon starts with the GHA backend
      # enabled. Step-level env is too late — the daemon is already running.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      # If update-lockfile pushed a new commit, check that out so hashFiles()
      # in the cache key matches what will be on master after merge.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-lockfile.outputs.head-sha || github.sha }}

      # Keyed by everything that affects compilation output. Also serves as the
      # cross-job transport for e2e and build-release (replaces upload-artifact,
      # which has proven unreliable for binary blobs on these runners).
      - name: Restore or cache release binaries
        id: binary-cache
        uses: actions/cache@v6
        with:
          path: |
            target/release/ncrs
            target/release/ncrs-open
            target/release/ncrs-gui
            dist/
          key: ncrs-release-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'ncrs_core/**/*.rs', 'ncrs-gui/src-tauri/**/*.rs', 'ncrs-gui/src/**', 'ncrs-gui/pnpm-lock.yaml') }}

      - name: Cache Cargo registry and git sources
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Install system dependencies
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libfuse3-dev \
            fuse3 \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            python3-nautilus \
            mold

      - name: Set up sccache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Rust stable
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: npm install -g pnpm@11

      - name: Install Node.js
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ncrs-gui/pnpm-lock.yaml

      - name: Build GUI frontend
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          cd ncrs-gui
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build release binaries
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release -p ncrs_core -p ncrs-gui --features ncrs-gui/custom-protocol

      - name: Run unit tests
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --release -p ncrs_core

      - name: Build .deb
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-deb.sh --skip-build

  e2e:
    name: e2e (data-loss)
    needs: [build]
    # Runs on every push and PR — including release-please's version-bump PRs.
    # Skipping it there once let releases (0.1.32–0.1.34) be cut on top of a red
    # e2e: the version bump changes Cargo.toml/lock so those PRs recompile anyway,
    # and e2e must gate the automerge, not be assumed-green from an earlier push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore release binaries
        uses: actions/cache@v6
        with:
          path: |
            target/release/ncrs
            target/release/ncrs-open
            target/release/ncrs-gui
            dist/
          key: ncrs-release-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'ncrs_core/**/*.rs', 'ncrs-gui/src-tauri/**/*.rs', 'ncrs-gui/src/**', 'ncrs-gui/pnpm-lock.yaml') }}

      - name: Stage .deb for Docker build context
        run: cp dist/ncrs_*.deb docker/e2e/ncrs/ncrs.deb

      - name: Run e2e suite
        env:
          PREBUILT_BINARY: "1"
        run: scripts/e2e.sh

  release-please:
    # Manage the release PR and cut releases; pushes to master only.
    # Gated on build + e2e: this repo has no branch protection (private/free tier),
    # so the release-please PR auto-merges without required checks. Depending on
    # e2e here means a release is never cut (tag/PR never advanced) while e2e is
    # red — which is how 0.1.32–0.1.34 got tagged with no .deb.
    needs: [build, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    # Assemble and publish the .deb using the binaries already built and tested
    # by the build + e2e jobs. Gated on release-please having cut a release.
    needs: [build, e2e, release-please]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            fuse3 \
            libssl-dev \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Restore release binaries
        uses: actions/cache@v6
        with:
          path: |
            target/release/ncrs
            target/release/ncrs-open
            target/release/ncrs-gui
            dist/
          key: ncrs-release-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'ncrs_core/**/*.rs', 'ncrs-gui/src-tauri/**/*.rs', 'ncrs-gui/src/**', 'ncrs-gui/pnpm-lock.yaml') }}

      - name: Fix binary permissions
        run: chmod +x target/release/ncrs target/release/ncrs-open target/release/ncrs-gui

      - name: Test .deb
        run: bash scripts/test-deb.sh --container

      - name: Upload .deb to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$tag" dist/*.deb
