name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Must be job-level so the sccache daemon starts with the GHA backend
      # enabled. Step-level env is too late — the daemon is already running.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      # Keyed by everything that affects compilation output. Also serves as the
      # cross-job transport for e2e and build-release (replaces upload-artifact,
      # which has proven unreliable for binary blobs on these runners).
      - name: Restore or cache release binaries
        id: binary-cache
        uses: actions/cache@v6
        with:
          path: |
            target/release/ncrs
            target/release/ncrs-open
            target/release/ncrs-gui
            dist/
          key: ncrs-release-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'ncrs_core/**/*.rs', 'ncrs-gui/src-tauri/**/*.rs', 'ncrs-gui/src/**', 'ncrs-gui/pnpm-lock.yaml') }}

      - name: Cache Cargo registry and git sources
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Install system dependencies
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libfuse3-dev \
            fuse3 \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            python3-nautilus \
            mold

      - name: Set up sccache
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Rust stable
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: npm install -g pnpm@11

      - name: Install Node.js
        if: steps.binary-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ncrs-gui/pnpm-lock.yaml

      - name: Build GUI frontend
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          cd ncrs-gui
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build release binaries
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release -p ncrs_core -p ncrs-gui --features ncrs-gui/custom-protocol

      - name: Run unit tests
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --release -p ncrs_core

      - name: Build .deb
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-deb.sh --skip-build

  e2e:
    name: e2e (data-loss)
    needs: [build]
    # Release-please PRs only change CHANGELOG + version; the code that e2e
    # exercises is identical to what already passed on the preceding code push.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore release binaries
        uses: actions/cache@v6
        with:
          path: |
            target/release/ncrs
            target/release/ncrs-open
            target/release/ncrs-gui
            dist/
          key: ncrs-release-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'ncrs_core/**/*.rs', 'ncrs-gui/src-tauri/**/*.rs', 'ncrs-gui/src/**', 'ncrs-gui/pnpm-lock.yaml') }}

      - name: Stage .deb for Docker build context
        run: cp dist/ncrs_*.deb docker/e2e/ncrs/ncrs.deb

      - name: Run e2e suite
        env:
          PREBUILT_BINARY: "1"
        run: scripts/e2e.sh

  release-please:
    # Manage the release PR and cut releases; pushes to master only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    # Assemble and publish the .deb using the binaries already built and tested
    # by the build + e2e jobs. Gated on release-please having cut a release.
    needs: [build, e2e, release-please]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            fuse3 \
            libssl-dev \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Restore release binaries
        uses: actions/cache@v6
        with:
          path: |
            target/release/ncrs
            target/release/ncrs-open
            target/release/ncrs-gui
            dist/
          key: ncrs-release-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'ncrs_core/**/*.rs', 'ncrs-gui/src-tauri/**/*.rs', 'ncrs-gui/src/**', 'ncrs-gui/pnpm-lock.yaml') }}

      - name: Fix binary permissions
        run: chmod +x target/release/ncrs target/release/ncrs-open target/release/ncrs-gui

      - name: Test .deb
        run: bash scripts/test-deb.sh --container

      - name: Upload .deb to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$tag" dist/*.deb
