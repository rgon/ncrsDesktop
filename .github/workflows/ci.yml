name: CI

# One workflow so the release build can depend on the same test + e2e jobs
# instead of re-running them. e2e (which compiles the daemon and drives a FUSE
# mount over a real WebDAV server) runs once per commit and gates both the
# ordinary build check and the release.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libfuse3-dev \
            fuse3 \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            python3-nautilus \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p ncrs_core

  e2e:
    name: e2e (data-loss)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs the ncrs CLI daemon against a real (non-Nextcloud) WebDAV server
      # over FUSE and asserts no data loss across CRUD / move / delete.
      # ubuntu-latest ships docker + compose and exposes /dev/fuse.
      - name: Run e2e suite
        run: scripts/e2e.sh

  release-please:
    # Manage the release PR and cut releases; pushes to master only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    # Publish the .deb. Gated on the test + e2e jobs (which already ran once for
    # this commit) and on release-please having cut a release — the e2e suite is
    # a shared dependency here, never a duplicated step.
    needs: [test, e2e, release-please]
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libfuse3-dev \
            fuse3 \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            python3-nautilus \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ncrs-gui/pnpm-lock.yaml

      - name: Build .deb
        run: bash scripts/build-deb.sh

      - name: Test .deb
        run: bash scripts/test-deb.sh --container

      - name: Upload .deb to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$tag" dist/*.deb
