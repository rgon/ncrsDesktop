[workspace]
members = [
  "ncrs_core",
  "ncrs_passthrough",
  "ncrs-gui/src-tauri",
  "plugins/ncrs_plugin",
  "plugins/nc_passwords",
  "plugins/nc_gnome_integration",
]
# Patched third-party crates (see [patch.crates-io] below) are dependencies,
# not members: keep `cargo test --workspace` from running their own suites.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.91" # x-release-please-version
edition = "2021"
authors = ["Gonzalo Ruiz <foss@rgon.es>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
clap = "4.5.40"

# fuser 0.17.0 plus the reattach patch (Session::from_fd_initialized,
# BackingId::raw_id) that lets a restarted daemon take over a live FUSE
# connection. See PATCHES.md, "fuser: reattach".
[patch.crates-io]
fuser = { path = "vendor/fuser" }
