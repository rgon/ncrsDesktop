# ncrs: let the QUIC (HTTP/3) download sockets have 4 MiB buffers.
#
# ncrs asks for 4 MiB SO_RCVBUF/SO_SNDBUF on its UDP sockets, but the kernel caps
# that at these limits, which default to ~208 KiB. At tens of MB/s that small a
# buffer overruns during brief scheduling delays and the kernel drops datagrams,
# which QUIC then treats as congestion and slows down for.
#
# The low "05-" prefix is deliberate: sysctl.d files apply in filename order and
# the last one wins, so any other file that sets these (a distro's or yours) takes
# precedence and this can only ever raise the kernel default, never lower a value
# someone chose. To opt out, create /etc/sysctl.d/05-ncrs-quic.conf (empty, or a
# symlink to /dev/null), which masks this file.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
