[package]
name = "ncrs_lib"
version = "0.1.0"
edition = "2021"

[dependencies]
fuser = "0.11"
libc = "0.2"
log = "0.4"
env_logger = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }