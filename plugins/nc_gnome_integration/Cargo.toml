[package]
name = "nc_gnome_integration"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
ncrs_plugin = { path = "../ncrs_plugin" }
tauri = { version = "2" }
log = "0.4"
anyhow = "1"
dirs = "6"
tokio = { version = "1" }
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
