[package]
name = "ncrs-gui"
version.workspace = true
description = "ncRS — Nextcloud desktop client"
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ncrs_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the built frontend (frontendDist) instead of pointing the webview at
# the vite dev server (devUrl). The tauri CLI enables it for `tauri build`;
# plain-cargo release builds (scripts/build-deb.sh) must pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1.45.1", features = ["rt"] }
ncrs_core = { path = "../../ncrs_core" }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-runtime-wry = "2.6.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
env_logger = "0.11"
ncrs_plugin = { path = "../../plugins/ncrs_plugin" }
nc_passwords = { path = "../../plugins/nc_passwords" }
