[package]
name = "ncrs-gui"
version.workspace = true
description = "ncRS — Nextcloud desktop client"
authors.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ncrs_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the built frontend (frontendDist) instead of pointing the webview at
# the vite dev server (devUrl). The tauri CLI enables it for `tauri build`;
# plain-cargo release builds (scripts/build-deb.sh) must pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Scheme validation for `open_link`; same major as the one ncrs_core resolves.
url = "2"
# Signal handling for a clean unmount on SIGTERM/SIGINT.
libc = "0.2"
tokio = { version = "1.45.1", features = ["rt"] }
ncrs_core = { path = "../../ncrs_core" }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-runtime-wry = "2.6.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
dirs = "6.0.0"
ncrs_plugin = { path = "../../plugins/ncrs_plugin" }
nc_passwords = { path = "../../plugins/nc_passwords" }
nc_gnome_integration = { path = "../../plugins/nc_gnome_integration" }

# Replace the system (glibc) allocator on Unix. This process churns large
# (up to 64 MB) read-ahead and thumbnail buffers across dozens of FUSE worker
# threads; glibc retained the freed memory in per-thread arenas and RSS crept
# to ~2 GB. jemalloc gives it back to the OS. MSVC is excluded (unsupported).
#
# unprefixed_malloc_on_supported_platforms: makes jemalloc export the plain
# `malloc`/`free`/`malloc_conf` symbols instead of the default `_rjem_`-prefixed
# ones. Required so (a) our `#[export_name = "malloc_conf"]` tuning is the symbol
# jemalloc actually reads, and (b) C libraries linked in (webkit/glib/openssl)
# also route through jemalloc rather than glibc.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }
