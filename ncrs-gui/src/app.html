<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ncRS</title>
    <script>
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light');
        mq.addEventListener('change', function (e) {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        });
        // Apply the server's accent colour from the last session *before* first
        // paint. Without this the window renders with the default accent and then
        // repaints once get_nc_theme's network round-trip returns, which reads as
        // a blue flash on every open.
        try {
          var accent = localStorage.getItem('ncrs.accent');
          if (accent) {
            document.documentElement.style.setProperty('--nc-accent', accent);
          }
        } catch (e) { /* private mode / storage disabled: just skip the cache */ }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
