# A plain WebDAV collection (Apache mod_dav — NOT Nextcloud) served at the same
# URL layout the ncrs daemon uses for writes: it reads from the configured `url`
# but writes to `{host}/remote.php/dav/files/{username}/`, so we expose a real
# DAV collection at exactly that path and point `url` at it too.
DavLockDB /tmp/davlock/lock

# Apache marks the ETag of a just-modified file "weak" (W/"…") for one second,
# and weak ETags are invalid for If-Match, so the daemon's conditional PUT on an
# overwrite gets a 412. Nextcloud (the daemon's target) always returns strong
# ETags, so strip the weak marker to give the daemon that same contract.
Header edit ETag "^W/(.*)$" "$1"

Alias /remote.php/dav/files/testuser /data/files
<Directory /data/files>
    Dav On
    Options Indexes FollowSymLinks
    AuthType Basic
    AuthName "ncrs-e2e"
    AuthUserFile /usr/local/apache2/conf/dav.users
    Require valid-user
</Directory>
