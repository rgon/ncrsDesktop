# End-to-end test stack: a real (non-Nextcloud) WebDAV server and the ncrs CLI
# daemon that FUSE-mounts it. The `ncrs` service runs the data-loss scenarios
# and its exit code is the suite result.
#
# Run with:  scripts/e2e.sh   (or: docker compose -f docker/e2e/docker-compose.yml
#            up --build --abort-on-container-exit --exit-code-from ncrs)
services:
  # Plain WebDAV via rclone (NOT Nextcloud): strong ETags and a configurable
  # base path, served at the same layout the daemon writes to.
  webdav:
    image: rclone/rclone:1.71
    command:
      - serve
      - webdav
      - /data
      - --addr=:80
      - --baseurl=/remote.php/dav/files/testuser
      - --user=testuser
      - --pass=testpass
    volumes:
      - webdav-data:/data

  ncrs:
    build:
      context: ../..
      dockerfile: docker/e2e/ncrs/Dockerfile
      args:
        PREBUILT_BINARY: ${PREBUILT_BINARY:-0}
    depends_on:
      - webdav
    environment:
      WEBDAV_HOST: webdav
      RUST_LOG: info
    # FUSE inside the container needs the fuse device and mount capability.
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

volumes:
  webdav-data:
