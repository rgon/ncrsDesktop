[package]
name = "ncrs_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
default-run = "ncrs"

[[bin]]
name = "ncrs"
path = "src/main.rs"

[dependencies]
log = "0.4"
libc = "0.2"
fuser = "0.17.0"
serde = { version = "1.0", features = ["derive", "rc"] }
yaml-rust2 = "0.10.3"
remotefs = "0.3"
remotefs-webdav = "0.2"
dirs = "6.0.0"
env_logger = "0.11.10"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking", "json", "http2", "http3", "charset", "rustls", "query", "form",
] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
percent-encoding = "2"
md5 = "0.7"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.36"
httpdate = "1"
url = "2"
serde_json = "1"
clap = { workspace = true, features = ["derive"] }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
keyring = "2"

[[bin]]
name = "ncrs-open"
path = "src/bin/ncrs_open.rs"

[dev-dependencies]
tempfile = "3"
