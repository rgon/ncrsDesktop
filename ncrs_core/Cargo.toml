[package]
name = "ncrs_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "ncrs"

[[bin]]
name = "ncrs"
path = "src/main.rs"

[dependencies]
log = "0.4"
libc = "0.2"
fuser = "0.17.0"
serde = { version = "1.0", features = ["derive", "rc"] }
yaml-rust2 = "0.10.3"
dirs = "6.0.0"
env_logger = "0.11.10"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking", "json", "http2", "http3", "charset", "rustls", "query", "form",
] }
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync"] }
percent-encoding = "2"
md5 = "0.7"
crc32fast = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.36"
httpdate = "1"
url = "2"
serde_json = "1"
clap = { workspace = true, features = ["derive"] }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
keyring = "2"
seccompiler = "0.5.0"

# Replace the system (glibc) allocator in the `ncrs` daemon on Unix — see the
# `#[global_allocator]` in src/main.rs. unprefixed_malloc_on_supported_platforms
# makes jemalloc export the plain `malloc`/`malloc_conf` symbols, so the
# `malloc_conf` tuning there is the one it reads. MSVC is excluded (unsupported).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[[bin]]
name = "ncrs-open"
path = "src/bin/ncrs_open.rs"

[[bin]]
name = "ncrs-ctl"
path = "src/bin/ncrs_ctl.rs"

[dev-dependencies]
tempfile = "3"
