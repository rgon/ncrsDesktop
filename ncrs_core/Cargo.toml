[package]
name = "ncrs_core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[package.metadata.deb]
name = "ncrs"
maintainer = "Gonzalo Ruiz <gonza@logo.cl>"
extended-description = "Mounts your Nextcloud as a local FUSE filesystem with offline caching, real-time sync, conflict detection, and GNOME/Nautilus integration."
depends = "$auto, fuse3"
section = "net"
priority = "optional"
assets = [
  ["target/release/ncrs", "usr/bin/ncrs", "755"],
  ["target/release/ncrs-open", "usr/bin/ncrs-open", "755"],
  ["../packaging/ncrs.service", "usr/lib/systemd/user/ncrs.service", "644"],
  ["../packaging/ncrs-open.desktop", "usr/share/applications/ncrs-open.desktop", "644"],
  ["../shell_integration/nautilus/syncstate.py", "usr/share/nautilus-python/extensions/ncrs-syncstate.py", "644"],
  ["../shell_integration/gnome-search/ncrs-search-provider", "usr/bin/ncrs-search-provider", "755"],
  ["../shell_integration/gnome-search/es.rgon.ncrs.SearchProvider.ini", "usr/share/gnome-shell/search-providers/es.rgon.ncrs.SearchProvider.ini", "644"],
  ["../shell_integration/gnome-search/es.rgon.ncrs.desktop", "usr/share/applications/es.rgon.ncrs.desktop", "644"],
]
maintainer-scripts = "../packaging/maintainer-scripts"
systemd-units = []

[dependencies]
log = "0.4"
libc = "0.2"
fuser = "0.17.0"
serde = { version = "1.0", features = ["derive"] }
yaml-rust2 = "0.10.3"
remotefs = "0.3"
remotefs-webdav = "0.2"
dirs = "6.0.0"
env_logger = "0.11.10"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking", "json", "http2", "http3", "charset", "rustls-tls-native-roots",
] }
percent-encoding = "2"
md5 = "0.7"
crc32fast = "1"
quick-xml = "0.36"
httpdate = "1"
url = "2"
serde_json = "1"
clap = { workspace = true, features = ["derive"] }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

[[bin]]
name = "ncrs-open"
path = "src/bin/ncrs_open.rs"

[dev-dependencies]
tempfile = "3"
